services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://shopping:shopping@postgres:5432/shopping
      VANE_NAMESPACE: shopping
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - "127.0.0.1:${SHOPPING_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
  postgres:
    image: postgres:16.15
    environment:
      POSTGRES_USER: shopping
      POSTGRES_PASSWORD: shopping
      POSTGRES_DB: shopping
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - shopping-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopping -d shopping"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  shopping-data:
